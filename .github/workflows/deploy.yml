# 從 Notion 同步內容 → 建置 → 發佈到 GitHub Pages。
#
# 觸發時機：
#   1. 每 6 小時自動跑一次
#   2. 你在 GitHub 網頁（手機也可以）按 Run workflow
#   3. 有人 push 到 main
#
# 前置設定（只要做一次）：
#   Settings → Secrets and variables → Actions 新增兩個 secret：
#     NOTION_TOKEN        Notion 整合的 API 金鑰
#     NOTION_DATABASE_ID  資料庫 ID
#   Settings → Pages → Source 設為「GitHub Actions」
name: 同步 Notion 並部署

on:
  schedule:
    # UTC 時間，每 6 小時。台灣時間約 02:00 / 08:00 / 14:00 / 20:00
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # 需要寫入權限，才能把同步結果 commit 回 repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 用 npm install 而非 npm ci：package-lock.json 是在 Windows 產生的，
      # 缺少 Linux 版的 rollup 原生套件，npm ci 會直接失敗。
      - name: 安裝相依套件
        run: npm install --no-audit --no-fund

      # --prune-all：CI 是全新的 checkout，直接清空後重建，
      # 產出就是 Notion 當下狀態的精確鏡像。
      - name: 從 Notion 同步內容
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: npm run sync -- --prune-all

      - name: 內容有變化就存回 repo
        run: |
          git config user.name "notion-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/content/posts public/images/posts
          if git diff --staged --quiet; then
            echo "內容沒有變化，不需要 commit"
          else
            git commit -m "sync: 從 Notion 更新內容"
            git push
            echo "已更新 repo 內容"
          fi

      - name: 建置網站
        run: npm run build

      - name: 上傳建置結果
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: 發佈到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
